name: Terraform Plan

on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version
        required: false
        type: string
        default: "1.9.8"

      working-directory:
        description: Terraform working directory
        required: false
        type: string
        default: "infrastructure"

      backend-resource-group:
        description: Resource group containing Terraform state storage
        required: true
        type: string

      backend-storage-account:
        description: Storage account containing Terraform state
        required: true
        type: string

      backend-container:
        description: Blob container containing Terraform state
        required: true
        type: string

      backend-key:
        description: Terraform state blob name
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${{ inputs.backend-resource-group }}" \
            -backend-config="storage_account_name=${{ inputs.backend-storage-account }}" \
            -backend-config="container_name=${{ inputs.backend-container }}" \
            -backend-config="key=${{ inputs.backend-key }}" \
            -backend-config="use_oidc=true"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan
