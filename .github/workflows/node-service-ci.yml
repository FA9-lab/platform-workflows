name: Node Service CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the service
        required: false
        type: string
        default: '22'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run tests
        run: npm test
